  <script>
    (function () {
      const T = window.T;
      const L = (t) => t - 8.15;
      const root = document.querySelector('[data-composition-id="assistant"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // L'iris part du lien touché dans WhatsApp
      tl.fromTo("#a-iris", { clipPath: "circle(0px at 440px 1008px)" }, { clipPath: "circle(2300px at 440px 1008px)", duration: T.irisEnd - T.iris, ease: "power2.in" }, 0);

      // La question se tape dans le champ, puis part
      const Q = "Qui dois-je appeler en premier ?";
      const typed = $("#a-typed");
      const ph = $("#a-ph");
      const q = { n: 0 };
      const showQ = () => {
        const n = Math.round(q.n);
        typed.textContent = Q.slice(0, n);
        ph.style.opacity = n > 0 ? 0 : 1;
      };
      tl.fromTo(q, { n: 0 }, { n: Q.length, duration: T.send - 0.05 - T.ask, ease: "none", onUpdate: showQ }, L(T.ask));
      tl.to(q, { n: 0, duration: 0.01, onUpdate: showQ }, L(T.send));
      showQ();
      tl.fromTo("#a-q", { opacity: 0, y: 30, scale: 0.96, transformOrigin: "100% 100%" }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out" }, L(T.send));

      // Il réfléchit (il lit les prospects, la fiche, les relances), puis répond mot à mot
      tl.fromTo("#a-dots", { opacity: 0 }, { opacity: 1, duration: 0.15 }, L(T.think));
      tl.to("#a-dots", { opacity: 0, duration: 0.08 }, L(T.answer) - 0.05);
      ["#a-d1", "#a-d2", "#a-d3"].forEach((d, i) => {
        tl.fromTo(d, { y: 0, opacity: 0.4 }, { y: -10, opacity: 1, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, L(T.think) + i * 0.1);
      });
      const A =
        "Commencez par le +33 6 •• •• 41 18 : score 92, achat à Lyon 6e, et le T3 avec balcon matche à 100 %. Ensuite Karim B., dont le rappel est prévu aujourd'hui à 18 h 30.";
      const box = $("#a-text");
      const parts = A.replace(" :", " :").replace("100 %", "100 %").replace("18 h 30", "18 h 30").replace("+33 6 •• •• 41 18", "+33 6 •• •• 41 18").split(" ");
      parts.forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w" + (w.startsWith("+33") || w === "92," ? " hl" : "");
        s.id = "a-w" + i;
        s.textContent = w + (i < parts.length - 1 ? " " : "");
        box.appendChild(s);
      });
      tl.fromTo("#a-ans", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, L(T.answer));
      parts.forEach((w, i) => {
        tl.fromTo("#a-w" + i, { opacity: 0 }, { opacity: 1, duration: 0.08 }, L(T.answer) + 0.05 + i * 0.065);
      });
      tl.fromTo("#a-cons", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, L(T.consulted));

      // Il décroche son téléphone : balayage vers l'appel
      tl.to("#a-in", { x: -700, opacity: 0, filter: "blur(16px)", duration: 0.25, ease: "power3.in" }, L(T.whip));
      window.__timelines["assistant"] = tl;
    })();
