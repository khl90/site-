  <script>
    // La hauteur de la notification se mesure une fois, police chargée
    Promise.all([document.fonts.load('400 33px "Roboto"'), document.fonts.load('700 34px "Roboto"')]).then(function () {
      const T = window.T;
      const root = document.querySelector('[data-composition-id="ecran"]');
      const $ = (s) => root.querySelector(s);

      // ------------------------------- fond d'écran : la ville de la landing à l'aube
      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const W = 1080;
      const H = 1920;
      const ctx = $("#e-wall").getContext("2d");
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, "#060920");
      sky.addColorStop(0.45, "#141c52");
      sky.addColorStop(0.75, "#2a2f78");
      sky.addColorStop(1, "#3b3577");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);
      const dawn = ctx.createRadialGradient(W * 0.55, H * 0.8, 0, W * 0.55, H * 0.8, H * 0.55);
      dawn.addColorStop(0, "rgba(255,179,71,0.38)");
      dawn.addColorStop(1, "rgba(255,179,71,0)");
      ctx.fillStyle = dawn;
      ctx.fillRect(0, 0, W, H);
      const rand = seeded(8);
      const LAYERS = [
        { body: "#1b2160", w: 6, h: 9, gx: 11, gy: 15, minH: 0.36, maxH: 0.6 },
        { body: "#10153f", w: 14, h: 20, gx: 18, gy: 26, minH: 0.24, maxH: 0.46 },
        { body: "#070a24", w: 26, h: 36, gx: 26, gy: 36, minH: 0.12, maxH: 0.3 },
      ];
      LAYERS.forEach((L, li) => {
        let x = -30;
        while (x < W + 30) {
          const cols = 3 + Math.floor(rand() * (li === 2 ? 4 : 6));
          const tw = cols * (L.w + L.gx) + L.gx;
          const th = H * (L.minH + rand() * (L.maxH - L.minH));
          ctx.fillStyle = L.body;
          ctx.fillRect(x, H - th, tw, th);
          const rows = Math.floor((th - L.gy) / (L.h + L.gy));
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const p = rand();
              const wx = x + L.gx + c * (L.w + L.gx);
              const wy = H - th + L.gy + r * (L.h + L.gy);
              let col = null;
              if (li > 0 && p < 0.045) col = "rgba(92,230,165,0.95)";
              else if (li > 0 && p < 0.05) col = "rgba(255,179,71,0.9)";
              else if (p < 0.2) col = "rgba(190,200,240," + (0.06 + rand() * 0.1) + ")";
              if (!col) continue;
              if (col.startsWith("rgba(92")) {
                ctx.fillStyle = "rgba(92,230,165,0.16)";
                ctx.fillRect(wx - 6, wy - 6, L.w + 12, L.h + 12);
              }
              ctx.fillStyle = col;
              ctx.fillRect(wx, wy, L.w, L.h);
            }
          }
          x += tw + 6 + rand() * 20;
        }
      });
      // un voile en haut pour que l'heure se lise
      const veil = ctx.createLinearGradient(0, 0, 0, 900);
      veil.addColorStop(0, "rgba(3,5,18,0.45)");
      veil.addColorStop(1, "rgba(3,5,18,0)");
      ctx.fillStyle = veil;
      ctx.fillRect(0, 0, W, 900);
      const img = ctx.getImageData(0, 0, W, H);
      const nr = seeded(3);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = (nr() - 0.5) * 6;
        img.data[i] += n;
        img.data[i + 1] += n;
        img.data[i + 2] += n;
      }
      ctx.putImageData(img, 0, 0);

      const tl = gsap.timeline({ paused: true });

      // 7:59 → 8:00
      tl.fromTo("#e-c1", { opacity: 1, y: 0, filter: "blur(0px)" }, { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, T.flip);
      tl.fromTo("#e-c2", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, T.flip + 0.12);

      // Le rapport du matin tombe en haut ; les trois de la nuit se rangent en pile dessous
      tl.fromTo("#e-n0", { opacity: 0, y: -90, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, T.report);
      tl.fromTo("#e-n1", { y: 0, scale: 1, opacity: 1 }, { y: 250, scale: 1, opacity: 1, duration: 0.4, ease: "power3.inOut" }, T.report);
      tl.fromTo("#e-n2", { y: 0, scale: 1, opacity: 1 }, { y: 70, scale: 0.95, opacity: 0.75, duration: 0.4, ease: "power3.inOut" }, T.report);
      tl.fromTo("#e-n3", { y: 0, scale: 1, opacity: 1 }, { y: -110, scale: 0.9, opacity: 0.5, duration: 0.4, ease: "power3.inOut" }, T.report);
      // Dans une pile iOS, on ne voit que le bord des cartes du dessous
      tl.fromTo("#e-n2 .nt-h, #e-n2 .nt-b, #e-n2 .nt-ico, #e-n3 .nt-h, #e-n3 .nt-b, #e-n3 .nt-ico", { opacity: 1 }, { opacity: 0, duration: 0.25 }, T.report);
      tl.to("#e-title", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, T.tap - 0.2);

      // On touche le rapport : il s'enfonce, puis grandit jusqu'à couvrir l'écran (et devient WhatsApp)
      tl.fromTo("#e-n0", { scale: 1 }, { scale: 0.97, duration: 0.08, ease: "power2.in", immediateRender: false }, T.tap);
      tl.to("#e-n0", { scale: 1, duration: 0.15, ease: "power2.out" }, T.tap + 0.08);
      const n0 = $("#e-n0");
      const top = 660;
      const h = n0.offsetHeight;
      const ins = (t, r, b, l, rad) => "inset(" + t + "px " + r + "px " + b + "px " + l + "px round " + rad + "px)";
      tl.fromTo(
        "#e-grow",
        { opacity: 1, clipPath: ins(top, 36, 1920 - top - h, 36, 44), backgroundColor: "#fafafc" },
        { opacity: 1, clipPath: ins(0, 0, 0, 0, 0), backgroundColor: "#0b141a", duration: T.zoomEnd - T.zoom, ease: "power3.in" },
        T.zoom,
      );
      tl.set("#e-grow", { opacity: 0 }, 0);
      tl.to("#e-n0 .nt-b, #e-n0 .nt-h, #e-n0 .nt-ico", { opacity: 0, duration: 0.12 }, T.zoom);
      tl.fromTo("#e-world", { scale: 1, filter: "blur(0px)" }, { scale: 1.06, filter: "blur(12px)", duration: T.zoomEnd - T.zoom, ease: "power3.in" }, T.zoom);

      window.__timelines["ecran"] = tl;
    });
  </script>
