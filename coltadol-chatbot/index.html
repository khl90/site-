<!doctype html>
<html
  lang="fr"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"color-night","type":"color","label":"Nuit (fond)","default":"#0b1130"},
    {"id":"color-lamp","type":"color","label":"Ambre (en attente)","default":"#ffb347"},
    {"id":"color-signal","type":"color","label":"Vert (répondu)","default":"#5ce6a5"},
    {"id":"color-limewash","type":"color","label":"Texte clair","default":"#eef0fa"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Coltadol — C'est juste un chatbot ?</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/timeline.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b1130;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1080" data-height="1920">
      <!-- Le fond : la nuit et la ville de la landing, qui glisse un peu à chaque slide -->
      <div id="fond" data-composition-id="fond" data-composition-src="compositions/fond.html" data-start="0" data-duration="22" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 1"></div>

      <!-- Les six slides : chacune entre par la droite et sort par la gauche, comme un carrousel -->
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="3.2" data-duration="4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="6.8" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="10.4" data-duration="4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="14" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 6"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="17.6" data-duration="4.4" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index: 7"></div>

      <!-- Sons : un souffle à chaque balayage (deux prises en alternance), un pop sur chaque pastille -->
      <audio id="sw1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.11" data-duration="0.57" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sw2" class="clip" src="assets/sfx/whoosh.mp3" data-start="6.71" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sw3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="10.31" data-duration="0.57" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sw4" class="clip" src="assets/sfx/whoosh.mp3" data-start="13.91" data-duration="0.57" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sw5" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="17.51" data-duration="0.57" data-track-index="10" data-volume="0.35"></audio>
      <audio id="p1" class="clip" src="assets/sfx/pop.mp3" data-start="0.52" data-duration="0.7" data-track-index="12" data-volume="0.4"></audio>
      <audio id="p2" class="clip" src="assets/sfx/pop.mp3" data-start="4.83" data-duration="0.7" data-track-index="12" data-volume="0.4"></audio>
      <audio id="p3" class="clip" src="assets/sfx/click-soft.mp3" data-start="8.83" data-duration="0.36" data-track-index="13" data-volume="0.6"></audio>
      <audio id="p4" class="clip" src="assets/sfx/pop.mp3" data-start="12.08" data-duration="0.7" data-track-index="12" data-volume="0.4"></audio>
      <audio id="p5" class="clip" src="assets/sfx/pop.mp3" data-start="15.18" data-duration="0.7" data-track-index="12" data-volume="0.35"></audio>
      <audio id="mk" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="18.88" data-duration="2.1" data-track-index="14" data-volume="0.28"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
