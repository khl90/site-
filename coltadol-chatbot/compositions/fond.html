<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0b1130;
    }
    /* Le ciel de la landing : haut presque noir, bas indigo, halo ambre au ras des toits */
    #fd-sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(90% 40% at 62% 100%, rgb(255 179 71 / 0.1) 0%, transparent 60%),
        radial-gradient(130% 55% at 55% 108%, #2b3a8a 0%, transparent 62%),
        radial-gradient(160% 90% at 50% 0%, #04071a 0%, #0b1130 60%, #111a42 100%);
    }
    #fd-city {
      position: absolute;
      left: -120px;
      top: 1180px;
      width: 1700px;
      height: 740px;
    }
  </style>
  <div id="root" data-composition-id="fond" data-width="1080" data-height="1920">
    <div id="fd-sky"></div>
    <canvas id="fd-city" width="1700" height="740" data-layout-ignore></canvas>
  </div>
  <script>
    (function () {
      const S = window.S;
      const root = document.querySelector('[data-composition-id="fond"]');
      const cv = root.querySelector("#fd-city");
      const ctx = cv.getContext("2d");
      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // Deux plans de tours, fenêtres endormies, quelques-unes allumées (ambre = attend, vert = répondu)
      const rand = seeded(20261029);
      const W = 1700;
      const H = 740;
      const LAYERS = [
        { body: "#141d50", w: 8, h: 12, gx: 12, gy: 18, minH: 0.45, maxH: 0.95 },
        { body: "#070b26", w: 18, h: 26, gx: 20, gy: 30, minH: 0.25, maxH: 0.6 },
      ];
      LAYERS.forEach((L, li) => {
        let x = 0;
        while (x < W) {
          const cols = 3 + Math.floor(rand() * 5);
          const tw = cols * (L.w + L.gx) + L.gx;
          const th = H * (L.minH + rand() * (L.maxH - L.minH));
          ctx.fillStyle = L.body;
          ctx.fillRect(x, H - th, tw, th);
          const rows = Math.floor((th - L.gy) / (L.h + L.gy));
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const p = rand();
              const wx = x + L.gx + c * (L.w + L.gx);
              const wy = H - th + L.gy + r * (L.h + L.gy);
              if (p < 0.012) {
                ctx.fillStyle = "rgba(92,230,165,0.95)";
              } else if (p < 0.018) {
                ctx.fillStyle = "rgba(255,179,71,0.9)";
              } else if (p < 0.2) {
                ctx.fillStyle = "rgba(190,200,240," + (0.06 + rand() * 0.1) + ")";
              } else continue;
              ctx.fillRect(wx, wy, L.w, L.h);
            }
          }
          x += tw + 6 + rand() * 18;
        }
      });

      const tl = gsap.timeline({ paused: true });
      // La ville glisse d'un cran à chaque balayage : la profondeur du carrousel
      tl.fromTo("#fd-city", { x: 0 }, { x: 0, duration: 0.01 }, 0);
      S.B.slice(1).forEach((b, i) => {
        tl.to("#fd-city", { x: -(i + 1) * 70, duration: S.SWIPE, ease: "power3.inOut" }, b);
      });
      window.__timelines["fond"] = tl;
    })();
  </script>
</template>
