  <script>
    (function () {
      const N = window.N;
      const root = document.querySelector('[data-composition-id="fiche"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // La bulle de Lyon grandit et devient la fiche (coordonnées de la fiche, avant l'échelle 0,8)
      const e = N.EQ[3];
      const bx = (e.x - 20 - N.camX(N.fiche) - 880) / 0.8;
      const by = (372 - 110) / 0.8;
      const bw = 560 / 0.8;
      const bh = 190 / 0.8;
      const ins = (t, r, b, l, rad) => "inset(" + t + "px " + r + "px " + b + "px " + l + "px round " + rad + "px)";
      tl.fromTo(
        "#fi-morph",
        { clipPath: ins(by, 960 - bx - bw, 1060 - by - bh, bx, 34), borderColor: "#5ce6a5" },
        { clipPath: ins(0, 0, 0, 0, 48), borderColor: "rgba(143,152,198,0.18)", duration: 0.45, ease: "power3.inOut" },
        0,
      );
      tl.fromTo("#fi-card", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.4);

      const fill = (id, at) => {
        tl.to("#" + id + " .fi-e", { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, at);
        tl.fromTo("#" + id + " .fi-v", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, at + 0.06);
        tl.fromTo("#" + id, { borderColor: "rgba(143,152,198,0.18)" }, { borderColor: "rgba(92,230,165,0.5)", duration: 0.25 }, at + 0.06);
      };
      const strike = (id, at) => tl.to("#" + id, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" }, at);
      const t0 = 0.7;
      fill("fi-f-type", t0);
      fill("fi-f-city", t0 + 0.12);
      fill("fi-f-rooms", t0 + 0.24);
      strike("fi-mc-type", t0 + 0.1);
      strike("fi-mc-city", t0 + 0.2);
      fill("fi-f-intent", t0 + 0.55);
      fill("fi-f-urgency", t0 + 0.67);
      strike("fi-mc-intent", t0 + 0.6);
      tl.fromTo("#fi-hot", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t0 + 0.8);
      fill("fi-f-budget", t0 + 1.0);
      strike("fi-mc-budget", t0 + 1.05);
      tl.fromTo("#fi-nothing", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 1.4);

      const CIRC = 326.73;
      const score = { v: 0 };
      const ringC = $("#fi-ring-c");
      const scoreEl = $("#fi-score");
      const show = () => {
        scoreEl.textContent = String(Math.round(score.v));
        ringC.setAttribute("stroke-dashoffset", String(CIRC * (1 - score.v / 100)));
      };
      tl.fromTo(score, { v: 0 }, { v: 24, duration: 0.5, ease: "power2.out", onUpdate: show }, t0 + 0.1);
      tl.fromTo(score, { v: 24 }, { v: 58, duration: 0.5, ease: "power2.out", onUpdate: show, immediateRender: false }, t0 + 0.6);
      tl.fromTo(score, { v: 58 }, { v: 92, duration: 0.7, ease: "power2.out", onUpdate: show, immediateRender: false }, t0 + 1.1);
      tl.fromTo(ringC, { attr: { stroke: "#5ce6a5" } }, { attr: { stroke: "#ffb347" }, duration: 0.3 }, t0 + 1.45);
      tl.to("#fi-st-new", { opacity: 0, duration: 0.15 }, t0 + 1.75);
      tl.fromTo("#fi-st-ok", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t0 + 1.77);
      tl.to("#fi-mode-from", { opacity: 0, y: -10, duration: 0.2 }, t0 + 2.0);
      tl.fromTo("#fi-mode-to", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, t0 + 2.07);
      show();

      // La fiche se range : la nuit continue
      tl.to("#fi-out", { opacity: 0, scale: 0.94, filter: "blur(10px)", duration: 0.3, ease: "power3.in", transformOrigin: "50% 50%" }, N.ficheOut - N.fiche);
      window.__timelines["fiche"] = tl;
    })();
