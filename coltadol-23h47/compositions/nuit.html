  <script>
    (function () {
      const T = window.T;
      const root = document.querySelector('[data-composition-id="nuit"]');
      const $ = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      // ------------------------------------------- la ville, comme sur la landing
      const W = 1080;
      const H = 1920;
      // la toile déborde l'écran de OX à gauche et de OY en haut
      const OX = 570;
      const OY = 150;
      const CW = 2220;
      const CH = 2220;
      const LAMP = [255, 179, 71];
      const SIGNAL = [92, 230, 165];
      const COOL = [190, 200, 240];
      function seeded(seed) {
        let s = seed >>> 0;
        return () => {
          s = (s + 0x6d2b79f5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const LAYERS = [
        { body: "#18225c", win: { w: 6, h: 9, gx: 11, gy: 15 }, amb: 0.12, minH: 0.44, maxH: 0.72 },
        { body: "#0e1542", win: { w: 14, h: 20, gx: 18, gy: 26 }, amb: 0.13, minH: 0.32, maxH: 0.56 },
        { body: "#060a22", win: { w: 28, h: 40, gx: 28, gy: 40 }, amb: 0.11, minH: 0.17, maxH: 0.38 },
      ];
      const rand = seeded(20261018);
      const towers = [];
      const wins = [];
      LAYERS.forEach((L, li) => {
        let x = -40;
        while (x < CW + 40) {
          const unit = L.win.w + L.win.gx;
          const cols = Math.max(2, Math.round((li === 2 ? 4 : 3) + rand() * (li === 2 ? 5 : 6)));
          const w = cols * unit + L.win.gx;
          const h = H * (L.minH + rand() * (L.maxH - L.minH));
          towers.push({ x, w, h, li });
          const rows = Math.floor((h - L.win.gy * 2) / (L.win.h + L.win.gy));
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (rand() < 0.08) continue;
              wins.push({
                x: x + L.win.gx + c * unit,
                y: OY + H - h + L.win.gy * 1.5 + r * (L.win.h + L.win.gy),
                w: L.win.w,
                h: L.win.h,
                li,
                amb: rand() < 0.2 ? L.amb * (0.5 + rand()) : 0,
              });
            }
          }
          x += w + (li === 2 ? 14 + rand() * 30 : 6 + rand() * 14);
        }
      });
      const nearest = (px, py, li, not) => {
        let best = null;
        let bd = 1e9;
        wins.forEach((w) => {
          if (w.li !== li || not.includes(w)) return;
          const d = (w.x + w.w / 2 - OX - px) ** 2 + (w.y + w.h / 2 - OY - py) ** 2;
          if (d < bd) {
            bd = d;
            best = w;
          }
        });
        return best;
      };
      const featured = nearest(560, 1360, 2, []);
      featured.amb = 0;
      const picked = [featured];
      const OTHERS = [
        [210, 1180, 1],
        [880, 1080, 1],
        [320, 1530, 2],
        [800, 1430, 2],
        [130, 1700, 2],
        [700, 1720, 2],
        [470, 1110, 0],
        [990, 1300, 1],
      ].map(([x, y, li]) => {
        const w = nearest(x, y, li, picked);
        w.amb = 0;
        picked.push(w);
        return w;
      });

      // Le fond (ciel, tours, fenêtres endormies) est peint une fois, avec un grain qui évite les aplats en bandes
      const base = document.createElement("canvas");
      base.width = CW;
      base.height = CH;
      const b = base.getContext("2d");
      const sky = b.createLinearGradient(0, OY, 0, OY + H);
      sky.addColorStop(0, "#04071a");
      sky.addColorStop(0.45, "#0a1030");
      sky.addColorStop(1, "#1a2462");
      b.fillStyle = sky;
      b.fillRect(0, 0, CW, CH);
      const g1 = b.createRadialGradient(OX + W * 0.6, OY + H * 1.05, 0, OX + W * 0.6, OY + H * 1.05, H * 0.75);
      g1.addColorStop(0, "rgba(43,58,138,0.9)");
      g1.addColorStop(1, "rgba(43,58,138,0)");
      b.fillStyle = g1;
      b.fillRect(0, 0, CW, CH);
      const g2 = b.createRadialGradient(OX + W * 0.65, OY + H, 0, OX + W * 0.65, OY + H, H * 0.5);
      g2.addColorStop(0, "rgba(255,179,71,0.12)");
      g2.addColorStop(1, "rgba(255,179,71,0)");
      b.fillStyle = g2;
      b.fillRect(0, 0, CW, CH);
      LAYERS.forEach((L, li) => {
        b.fillStyle = L.body;
        towers.filter((t) => t.li === li).forEach((t) => b.fillRect(t.x, OY + H - t.h, t.w, t.h + OY));
        if (li === 2) {
          b.fillStyle = "rgba(143,152,198,0.16)";
          towers.filter((t) => t.li === 2).forEach((t) => b.fillRect(t.x, OY + H - t.h, t.w, 2));
        }
        wins
          .filter((w) => w.li === li && w.amb)
          .forEach((w) => {
            b.fillStyle = "rgba(" + COOL.join(",") + "," + w.amb + ")";
            b.fillRect(w.x, w.y, w.w, w.h);
          });
      });
      const img = b.getImageData(0, 0, CW, CH);
      const nr = seeded(7);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = (nr() - 0.5) * 6;
        img.data[i] += n;
        img.data[i + 1] += n;
        img.data[i + 2] += n;
      }
      b.putImageData(img, 0, 0);

      const cv = $("#n-city");
      const ctx = cv.getContext("2d");
      const glowOf = [3, 7, 14];
      function lit(w, rgb, alpha, ringAge) {
        const g = glowOf[w.li];
        ctx.fillStyle = "rgba(" + rgb.join(",") + "," + 0.18 * alpha + ")";
        ctx.fillRect(w.x - g, w.y - g, w.w + g * 2, w.h + g * 2);
        ctx.fillStyle = "rgba(" + rgb.join(",") + "," + alpha + ")";
        ctx.fillRect(w.x, w.y, w.w, w.h);
        if (ringAge >= 0 && ringAge < 0.7 && w.li > 0) {
          const p = ringAge / 0.7;
          ctx.strokeStyle = "rgba(92,230,165," + 0.6 * (1 - p) + ")";
          ctx.lineWidth = w.li === 2 ? 3 : 2;
          ctx.beginPath();
          ctx.arc(w.x + w.w / 2, w.y + w.h / 2, (w.li === 2 ? 60 : 30) * p, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      // Une fenêtre qui s'allume grésille (ambre), puis passe au vert quand on lui répond
      function windowAt(w, t, on, answered) {
        if (t < on) return;
        if (t < answered) {
          const age = t - on;
          const a = age < 0.26 ? (Math.sin(age * 55) > -0.2 ? 0.55 + age * 1.6 : 0.2) : 0.95;
          lit(w, LAMP, a, -1);
        } else {
          lit(w, SIGNAL, 1, t - answered);
        }
      }
      function render(t) {
        ctx.drawImage(base, 0, 0);
        windowAt(featured, t, -1, T.a1);
        OTHERS.forEach((w, i) => {
          const on = T.others + i * 0.11;
          windowAt(w, t, on, on + 0.5);
        });
      }
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 26.5, duration: 26.5, ease: "none", onUpdate: () => render(clock.t) }, 0);

      // ------------------------------ l'avatar de l'en-tête devient l'écran
      const AV = { x: 162, y: 246, d: 96 };
      const s0 = AV.d / W;
      tl.fromTo(
        "#n-world",
        { x: AV.x - 540, y: AV.y - 960, scale: s0, transformOrigin: "1110px 1110px", clipPath: "circle(540px at 1110px 1110px)" },
        { x: 0, y: 0, scale: 1, clipPath: "circle(1110px at 1110px 1110px)", duration: T.zoomEnd - T.zoom, ease: "power3.in" },
        T.zoom,
      );
      // Pendant la conversation, l'avatar reste exactement à sa place
      tl.set("#n-world", { x: AV.x - 540, y: AV.y - 960, scale: s0, transformOrigin: "1110px 1110px", clipPath: "circle(540px at 1110px 1110px)" }, 0);

      // ----------------------------------------------------- titres de la nuit
      const words = (ids, at, gap) =>
        ids.forEach((id, i) => {
          tl.fromTo(id, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, at + i * gap);
        });
      const out = (ids, at) =>
        ids.forEach((id, i) => {
          tl.to(id, { opacity: 0, filter: "blur(10px)", duration: 0.16, ease: "power2.in" }, at + i * 0.04);
        });
      words(["#n-t1-w0", "#n-t1-w1"], T.night1, 0.12);
      out(["#n-t1-w0", "#n-t1-w1"], T.night2 - 0.2);
      words(["#n-t2-w0", "#n-t2-w1", "#n-t2-w2"], T.night2 + 0.05, 0.09);
      out(["#n-t2-w0", "#n-t2-w1", "#n-t2-w2"], T.morph - 0.12);

      // ----------------------------- la fenêtre verte grandit et devient la fiche
      const fx = featured.x - OX;
      const fy = featured.y - OY;
      const C = { l: 60, t: 230, w: 960, h: 1060 };
      const ins = (top, right, bottom, left, r) => "inset(" + top + "px " + right + "px " + bottom + "px " + left + "px round " + r + "px)";
      const from = ins(fy - C.t, C.l + C.w - (fx + featured.w), C.t + C.h - (fy + featured.h), fx - C.l, 3);
      tl.fromTo("#n-morph", { clipPath: from, backgroundColor: "#5ce6a5" }, { clipPath: ins(0, 0, 0, 0, 48), backgroundColor: "#111a42", duration: 0.5, ease: "power3.inOut" }, T.morph);
      tl.fromTo(
        "#n-cam",
        { scale: 1, filter: "blur(0px)", transformOrigin: featured.x + featured.w / 2 + "px " + (featured.y + featured.h / 2) + "px" },
        { scale: 2.4, filter: "blur(12px)", duration: 0.5, ease: "power3.inOut" },
        T.morph,
      );
      tl.fromTo("#n-dim", { opacity: 0 }, { opacity: 0.45, duration: 0.5, ease: "power2.inOut" }, T.morph);

      // ------------------------------------------------- la fiche se remplit
      tl.fromTo("#n-card", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T.card - 0.15);
      const fill = (id, at) => {
        tl.to("#" + id + " .f-e", { opacity: 0, y: -8, duration: 0.2, ease: "power2.in" }, at);
        tl.fromTo("#" + id + " .f-v", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, at + 0.06);
        tl.fromTo("#" + id, { borderColor: "rgba(143,152,198,0.18)" }, { borderColor: "rgba(92,230,165,0.5)", duration: 0.25 }, at + 0.06);
      };
      const strike = (id, at) => tl.to("#" + id, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power2.in" }, at);
      const t0 = T.card + 0.2;
      fill("f-type", t0);
      fill("f-city", t0 + 0.12);
      fill("f-rooms", t0 + 0.24);
      strike("mc-type", t0 + 0.1);
      strike("mc-city", t0 + 0.2);
      fill("f-intent", t0 + 0.55);
      fill("f-urgency", t0 + 0.67);
      strike("mc-intent", t0 + 0.6);
      tl.fromTo("#n-hot", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 18.75);
      fill("f-budget", t0 + 1.0);
      strike("mc-budget", t0 + 1.05);
      tl.fromTo("#n-nothing", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t0 + 1.4);

      // Le score suit les trois réponses : 24, 58, 92 ; l'anneau passe à l'ambre (prospect chaud)
      const CIRC = 326.73;
      const score = { v: 0 };
      const ringC = $("#n-ring-c");
      const scoreEl = $("#n-score");
      const showScore = () => {
        scoreEl.textContent = String(Math.round(score.v));
        ringC.setAttribute("stroke-dashoffset", String(CIRC * (1 - score.v / 100)));
      };
      tl.fromTo(score, { v: 0 }, { v: 24, duration: 0.5, ease: "power2.out", onUpdate: showScore }, t0 + 0.1);
      tl.fromTo(score, { v: 24 }, { v: 58, duration: 0.5, ease: "power2.out", onUpdate: showScore, immediateRender: false }, t0 + 0.6);
      tl.fromTo(score, { v: 58 }, { v: 92, duration: 0.7, ease: "power2.out", onUpdate: showScore, immediateRender: false }, t0 + 1.05);
      tl.fromTo(ringC, { attr: { stroke: "#5ce6a5" } }, { attr: { stroke: "#ffb347" }, duration: 0.3 }, t0 + 1.45);

      // Qualifié, et l'agent passe la main à l'équipe
      tl.to("#n-st-new", { opacity: 0, duration: 0.15 }, 19.7);
      tl.fromTo("#n-st-ok", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 19.72);
      tl.to("#n-mode-from", { opacity: 0, y: -10, duration: 0.2 }, 19.95);
      tl.fromTo("#n-mode-to", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 20.02);

      // La fiche s'efface pour la fin
      tl.to(["#n-card", "#n-morph"], { opacity: 0, scale: 0.94, filter: "blur(10px)", duration: 0.28, ease: "power3.in" }, T.cardOut);
      tl.to("#n-dim", { opacity: 0.6, duration: 0.4, ease: "power2.inOut" }, T.cardOut);

      render(0);
      showScore();
      window.__timelines["nuit"] = tl;
    })();
  </script>
</template>
