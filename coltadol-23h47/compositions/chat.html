      });
      // Les bulles « écrit… » se posent exactement là où arrivera la réponse
      [["ty-1", "m-a1"], ["ty-2", "m-a2"], ["ty-3", "m-a3"]].forEach(([ty, m]) => {
        $("#" + ty).style.top = pos[m].top + "px";
      });
      const Y = (id) => wrapH - 20 - (pos[id].top + pos[id].h);
      const Yty = (id) => wrapH - 20 - (pos[id].top + 82);

      // -------------------------------------------- états discrets, par le temps
      const st = { seen: $("#c-st-seen"), online: $("#c-st-online"), typing: $("#c-st-typing") };
      const ph = $("#c-in-ph");
      const caret = $("#c-caret");
      const hl = $("#c-key-hl");
      const mic = $("#c-mic");
      const arrow = $("#c-arrow");
      const ticks = {
        b1: [$("#tk-b1")],
        b2: [$("#tk-b2"), $("#tk-b2-2")],
        b3: [$("#tk-b3"), $("#tk-b3-2")],
      };
      const tickState = (el2, sent, delivered, read) => {
        // une coche à l'envoi, deux à la réception, bleues une fois lu
        const paths = el2[0].querySelectorAll("path");
        const col = read ? "#53bdeb" : "#8696a0";
        paths.forEach((p) => (p.style.stroke = col));
        if (el2[1]) el2[1].style.opacity = delivered ? 1 : 0;
      };
      const typingWin = [
        [T.typing1, T.a1],
        [T.typing2, T.a2],
        [T.typing3, T.a3],
      ];

      function render(t) {
        // Statut de l'agence dans l'en-tête
        let s = t < T.read1 ? "seen" : "online";
        typingWin.forEach(([a, b]) => {
          if (t >= a && t < b) s = "typing";
        });
        st.seen.style.opacity = s === "seen" ? 1 : 0;
        st.online.style.opacity = s === "online" ? 1 : 0;
        st.typing.style.opacity = s === "typing" ? 1 : 0;

        // Coches
        tickState(ticks.b1, true, true, t >= T.read1);
        tickState(ticks.b2, true, t >= T.b2Send + 0.15, t >= T.b2Send + 0.45);
        tickState(ticks.b3, true, t >= T.b3Send + 0.15, t >= T.b3Send + 0.45);

        // Saisie de l'acheteur
        let txt = "";
        let w = 0;
        let ch = null;
        const typed = (start, end, str, ws) => {
          if (t < start || t >= end) return false;
          const n = Math.min(str.length, Math.floor(((t - start) / (end - 0.08 - start)) * str.length));
          txt = str.slice(0, n);
          w = ws[n];
          ch = n > 0 && n < str.length ? str[n - 1] : null;
          return true;
        };
        const typing = typed(T.b2Type, T.b2Send, B2, W2) || typed(T.b3Type, T.b3Send, B3, W3);
        textEl.textContent = txt;
        const shift = Math.min(0, BOXW - 10 - w);
        textEl.style.transform = "translateX(" + shift + "px)";
        ph.style.opacity = txt ? 0 : 1;
        caret.style.opacity = typing ? 1 : 0;
        caret.style.left = Math.min(BOXW - 8, w + 2) + "px";
        mic.style.opacity = typing ? 0 : 1;
        arrow.style.opacity = typing ? 1 : 0;
        const k = ch ? keyFor(ch) : null;
        if (k) {
          hl.style.opacity = 1;
          hl.style.left = k.x + "px";
          hl.style.top = k.y + "px";
          hl.style.width = k.w + "px";
        } else {
          hl.style.opacity = 0;
        }
      }

      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: 14.6, duration: 14.6, ease: "none", onUpdate: () => render(clock.t) }, 0);

      // ------------------------------------------------------- le fil qui monte
      const thread = $("#c-thread");
      tl.fromTo(thread, { y: Y("m-b1") }, { y: Y("m-b1"), duration: 0.01 }, 0);
      const step = (y, at) => tl.to(thread, { y, duration: 0.3, ease: "power3.out" }, at);
      const bubble = (id, at, origin) =>
        tl.fromTo("#" + id, { opacity: 0, scale: 0.9, transformOrigin: origin }, { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out" }, at);
      tl.set("#m-b1", { opacity: 1 }, 0);

      const typingBubble = (n, a, b) => {
        tl.fromTo("#ty-" + n, { opacity: 0, scale: 0.8, transformOrigin: "0% 0%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, a);
        tl.to("#ty-" + n, { opacity: 0, duration: 0.06 }, b - 0.02);
        const reps = Math.max(0, Math.floor((b - a) / 0.25) - 1);
        ["a", "b", "c"].forEach((d, i) => {
          tl.fromTo("#ty-" + n + d, { y: 0, opacity: 0.45 }, { y: -10, opacity: 1, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: reps }, a + i * 0.12);
        });
      };

      typingBubble(1, T.typing1, T.a1);
      step(Yty("m-a1"), T.typing1);
      bubble("m-a1", T.a1, "0% 0%");
      step(Y("m-a1"), T.a1);

      bubble("m-b2", T.b2Send, "100% 0%");
      step(Y("m-b2"), T.b2Send);
      tl.fromTo("#mk-b2a", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.3, ease: "power2.out" }, T.b2Mark[0]);
      tl.fromTo("#mk-b2b", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.4, ease: "power2.out" }, T.b2Mark[1]);

      typingBubble(2, T.typing2, T.a2);
      step(Yty("m-a2"), T.typing2);
      bubble("m-a2", T.a2, "0% 0%");
      step(Y("m-a2"), T.a2);

      bubble("m-b3", T.b3Send, "100% 0%");
      step(Y("m-b3"), T.b3Send);
      tl.fromTo("#mk-b3a", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.3, ease: "power2.out" }, T.b3Mark[0]);
      tl.fromTo("#mk-b3b", { backgroundSize: "0% 100%" }, { backgroundSize: "100% 100%", duration: 0.3, ease: "power2.out" }, T.b3Mark[1]);

      typingBubble(3, T.typing3, T.a3);
      step(Yty("m-a3"), T.typing3);
      bubble("m-a3", T.a3, "0% 0%");
      step(Y("m-a3"), T.a3);

      // --------------------------------------------------------------- titres
      // Le crochet est là dès la première image ; il sort mot par mot
      ["#c-t1-w0", "#c-t1-w1", "#c-t1-w2", "#c-t1-w3"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, T.hookOut + i * 0.04);
      });
      tl.fromTo("#c-t1 .tt-l", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power2.in" }, T.hookOut + 0.06);

      // « Qui a répondu ? »
      tl.fromTo("#c-t2-box", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, T.question);
      ["#c-t2-w0", "#c-t2-w1", "#c-t2-w2"].forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, T.question + 0.05 + i * 0.07);
      });
      tl.to("#c-t2-box", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power3.in" }, T.zoom + 0.05);

      // ---------------------------------------------- poussée vers l'avatar
      tl.fromTo("#c-world", { scale: 1, filter: "blur(0px)", transformOrigin: "162px 246px" }, { scale: 1.12, filter: "blur(14px)", duration: T.zoomEnd - T.zoom, ease: "power3.in" }, T.zoom);

      render(0);
      window.__timelines["chat"] = tl;
    });
  </script>
</template>
